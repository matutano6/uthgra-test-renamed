name: PR con destino develop
run-name: PR con destino develop

env:
  APPLICATION_NAME: ${{ github.event.repository.name }}

on:
  push:
    branches:
      - 'develop'

jobs:
  Build-Docker-Image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build imagen docker con comandos
        run: docker build -t ghcr.io/uthgra-osuthgra/${{ env.APPLICATION_NAME }}:snapshot-${{ github.event.head_commit.timestamp }} .

      - name: Push imagen docker a registry GitHub
        run: docker push ghcr.io/uthgra-osuthgra/${{ env.APPLICATION_NAME }}:snapshot-${{ github.event.head_commit.timestamp }}
