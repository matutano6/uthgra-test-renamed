name: PR con destino develop
run-name: PR con destino develop

env:
  APPLICATION_NAME: ${{ github.event.repository.name }}

on:
  pull_request:
    branches:
      - 'develop'

jobs:
  Build-Docker-Image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build imagen docker con comandos
        run: |
          cd PExpress
          docker build -t ${{ env.APPLICATION_NAME }}:snapshot-${{ github.event.head_commit.timestamp }} .

